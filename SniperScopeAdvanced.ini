# Hermes Advanced Sniper Scope Configuration v2.0
# Professional Scope & Zoom Settings

[ScopeSettings]
Version=2.0.0-ULTRA
ScopeType=advanced

# ============================
# ZOOM SETTINGS
# ============================

[Zoom]
# Zoom Levels
DefaultZoom=4x
MinZoom=1x
MaxZoom=12x
ZoomStep=2x
QuickZoomEnabled=true
QuickZoomSpeed=0.2

# Dynamic Zoom
DynamicZoom=true
DistanceBasedZoom=true
AutoZoom=true
ZoomSmoothing=0.9

# Scope Modes
RedDotEnabled=true
HolographicEnabled=true
ACOGEnabled=true
SniperScopeEnabled=true
ThermalEnabled=true
NightVisionEnabled=true

# ============================
# CROSSHAIR SETTINGS
# ============================

[Crosshair]
# Style
ReticleType=dot
ReticleSize=medium
ReticleColor=green
ReticleOpacity=0.9
ReticleThickness=2

# Dynamic Reticle
DynamicReticle=true
SpreadReticle=true
RecoilReticle=true
MovingReticle=true

# Advanced Reticle
ReticleOutline=true
OutlineColor=black
OutlineThickness=1
CenterDot=true
DotSize=1
DotColor=red
MilDots=true
MilDotCount=4
MilDotSpacing=10

# ============================
# STABILIZATION
# ============================

[Stabilization]
# Scope Stabilization
StabilizationEnabled=true
StabilizationStrength=95
ScopeShake=true
ShakeReduction=90
BreathHold=true
BreathHoldDuration=5
BreathSteadyAim=true

# Advanced Stabilization
ScopeSway=true
SwayReduction=95
IdleSway=true
MovingSway=true
ADS_Sway=true
ProneSway=true

# ============================
# SENSITIVITY
# ============================

[Sensitivity]
# Scope Sensitivity
ScopeSensitivity=80
ADS_Sensitivity=100
QuickScopeSensitivity=120
NoScopeSensitivity=150

# Advanced Sensitivity
SensitivityByZoom=true
ZoomSensitivity1x=150
ZoomSensitivity2x=130
ZoomSensitivity4x=100
ZoomSensitivity8x=70
ZoomSensitivity12x=50

# Response
SensitivityCurve=logarithmic
DeadZone=0.05
Acceleration=1.0
Smoothing=0.9

# ============================
# SPECIAL MODES
# ============================

[SpecialModes]
# Thermal
ThermalEnabled=true
ThermalHighlight=red
ThermalContrast=high
ThermalNoise=false

# Night Vision
NightVisionEnabled=true
NightVisionColor=green
NightVisionIntensity=0.8
NightVisionNoise=false

# Variable Zoom
VariableZoomEnabled=true
ZoomLevels=4
ZoomStep=2x

# ============================
# PERFORMANCE
# ============================

[Performance]
# Optimization
ScopeFPS=144
ScopeLatency=5
ScopeQuality=ultra
ScopeRendering=high

# Advanced Performance
DynamicResolution=true
ResolutionScale=1.0
AntiAliasing=true
AnisotropicFiltering=true
