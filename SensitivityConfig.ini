# Hermes Advanced Sensitivity System v2.0
# Professional Sensitivity & Crosshair Configuration

[GlobalSettings]
Version=2.0.0-ULTRA
Game=CODM
Platform=Universal

# ============================
# SENSITIVITY SETTINGS
# ============================

[Sensitivity]
# General Sensitivity
GeneralSensitivity=150
ADS_Sensitivity=120
SniperSensitivity=80
ScopeSensitivity=90
RedDotSensitivity=130
HolographicSensitivity=125
2xScopeSensitivity=110
4xScopeSensitivity=95
8xScopeSensitivity=70
10xScopeSensitivity=60

# Gyroscope Sensitivity
GyroSensitivity=200
GyroADS=180
GyroSniper=120
GyroScope=140

# Advanced Sensitivity
SensitivityAcceleration=1.2
AimSensitivityCurve=logarithmic
DynamicSensitivity=true
SensitivityByDistance=true
CloseRangeBoost=1.3
MidRangeBoost=1.1
LongRangeBoost=0.9

# Smoothness
SmoothingFactor=0.85
AimSmoothing=0.90
RecoilSmoothing=0.88
MovementSmoothing=0.82

# Response Curve
ResponseCurve=1.3
DeadZone=0.05
MaxDeadZone=0.15
AntiDeadZone=0.8

# ============================
# CROSSHAIR SETTINGS
# ============================

[Crosshair]
# Style
CrosshairStyle=dynamic
CrosshairSize=medium
CrosshairThickness=2
CrosshairColor=green
CrosshairOpacity=0.9
CrosshairGap=4
CrosshairDot=true
DotSize=2
DotColor=red

# Dynamic Crosshair
DynamicCrosshair=true
SpreadVisualization=true
RecoilVisualization=true
MovementSpread=true
ADS_Spread=true

# Advanced Crosshair
CrosshairOutline=true
OutlineColor=black
OutlineThickness=1
CenterDot=true
HitMarker=true
KillMarker=true

# ============================
# AIM SETTINGS
# ============================

[AimSettings]
# Aim Type
AimType=hybrid
AimMode=advanced
AimStyle=aggressive

# Aim Speed
AimSpeed=1.5
ADSSpeed=1.3
QuickScopeSpeed=1.8
FlickSpeed=2.0
TrackingSpeed=1.2

# Aim Behavior
AimAssistStrength=100
AimLock=true
AimLockStrength=95
AimLockTime=3000
AimLockBreakOnSmoke=false
AimLockBreakOnFlash=false

# Targeting
HeadshotPriority=true
HeadshotPercentage=85
BodyshotPercentage=10
LimbShotPercentage=5
AutoHeadshot=true
SmartTargeting=true

# ============================
# MOVEMENT SETTINGS
# ============================

[Movement]
# Movement Assist
StrafeAim=true
JumpShot=true
DropShot=true
SlideCancel=true
BunnyHop=true
CrouchSpam=true

# Movement Prediction
MovementPrediction=true
PredictionStrength=90
PredictionAccuracy=85
InterpolationMode=cubic

# Advanced Movement
QuickScopeAssist=true
NoScopeAssist=true
TrickShot=true
360Assist=false
720Assist=false

# ============================
# RECOIL SETTINGS
# ============================

[Recoil]
# Recoil Control
RecoilControl=95
VerticalRecoil=90
HorizontalRecoil=85
BurstRecoil=88
SprayRecoil=82

# Recoil Patterns
PatternMemory=true
PatternPrediction=true
AdaptiveRecoil=true
RecoilSmoothing=0.92

# Advanced Recoil
MicroAdjustments=true
JitterReduction=95
CameraStability=90
ScopeStability=95

# ============================
# PERFORMANCE SETTINGS
# ============================

[Performance]
# Optimization
OptimizationLevel=ultra
CPUUsage=low
MemoryUsage=moderate
GPUUsage=minimal

# Target Performance
LatencyTarget=5
FrameRateTarget=144
RefreshRate=144
VSync=false

# Advanced Performance
AdaptiveQuality=true
PowerSaving=false
BatteryOptimization=false
ThermalManagement=false
